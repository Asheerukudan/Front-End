<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .btn1{
            background: orange;
            padding: 15px 40px;
            color:#fff;
            font-weight: bold;
            border:0;
            margin:10px;
            /* border-radius: 5px; */
        }
        .btn1:hover{
            background: orangered;
        }
        .btn2{
            background: transparent;
            border:2px solid orange;
            color:orange;
            padding: 15px 40px;
            margin: 10px;
            &:hover{
                background:orange;
                color:#fff
            }
        }
        .btn3{
            background:transparent;
            border:0;
            font-weight: bold;
            &:hover{
                color:orange
            }
        }
        /* display */
        .test-1{
            display:none;
            display: inline;
            background:orange
        }
        .test-2{
            display: block;
        }


        /* table 1 */
        .table1{
            width:90%;
            margin:40px auto;
            border:4px solid orange;
            border-collapse:collapse;
        }
        .table1 thead{background:orange}
        .table1 th, .table1 td{border:1px solid orange; padding: 6px;}
        /* grid */
        .card{
            background: orangered;
            color:#fff;
            padding: 10px;
            margin: 4px;
            width:90%;
            max-width: 180px;
        }
        .container{
            display:flex;
            gap:5px;
            flex-wrap: wrap;
            /*  */
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row;
            flex-direction: row-reverse;
            /* flex-direction: column; */

            justify-content:center;
            justify-content:end;
            justify-content:space-around;
            justify-content:space-between;
            background: yellowgreen;
            height:400px;
            align-items: baseline;
            align-items: center;
        }
        .box{
            background: conic-gradient(red, pink,red);
            width:60px;
            height:60px;
            margin:30px;
            border-radius:5px;
            text-align:center;
            color:#fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <button type="button" class="btn1">  Primary  butotn </button>
    <button type="button" class="btn2">  Secondary Button</button>
    <button type="button" class="btn3">  text button </button>

    <div class="test-1"> Lorem ipsum dolor sit. </div>
    <span class="test-2"> Lorem ipsum dolor sit.</span>

    <!-- table -->

    <table class="table1">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>User ID</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> 01</td>
                <td> Solomon</td>
                <td> 8934</td>
            </tr>
            <tr>
                <td> 02</td>
                <td> Solomon</td>
                <td> 8934</td>
            </tr>
            <tr>
                <td> 03</td>
                <td> Solomon</td>
                <td> 8934</td>
            </tr>
            <tr>
                <td> 04</td>
                <td> Solomon</td>
                <td> 8934</td>
            </tr>
        </tbody>
    </table>
    
    <!-- flex - grid -->
     <div class="container">
            <div class="card"> CARD 1</div>
            <div class="card"> CARD 2</div>
            <div class="card"> CARD 3</div>
            <div class="card"> CARD 4</div>
     </div>


     <div class="box"> <i class="fa-solid fa-home"></i></div>

</body>
</html>
