<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webdev</title>
</head>
<body>
    
    <!-- media/object  -->
     <!-- Iframe: Embed a webpage -->
    <iframe src="class1.html" frameborder="0"></iframe>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3939.95129264933!2d7.508512175077892!3d9.068202090994447!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x104e0bccd4d3458d%3A0x73f696e798b1e997!2sNational%20Assembly%20of%20Nigeria!5e0!3m2!1sen!2sng!4v1795167503577!5m2!1sen!2sng" width="400" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <br>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/Ib8U9bupqMM?si=U7G5WEFyzQchWRaG" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!-- Forms and user input -->

    <input type="text" placeholder="Full Name">
    <input type="number" step="5" placeholder="+234" value="+234" disabled>
    <input type="password">
    <input type="date">
    <input type="search">
    <input type="time">
    <input type="email">
    <input type="color">
    <input type="file">
    <input type="radio">
    <input type="checkbox" checked>
    <br>
    <!-- select -->
    <select name="" id="">
        <option value="">Courses</option>
        <option value="">CSS</option>
        <option value="">PY</option>
        <option value="">HTML</option>
        <option value="">JS</option>
    </select>
    <br>
    <!-- Textarea -->

    <textarea name="" id="" rows="30" cols="60"></textarea>
    <br>
    <!-- buttons -->
     <button type="button">Send</button>
     <button type="submit">Sumit</button>
     <button type="reset">Reset</button>
</body>
</html>
