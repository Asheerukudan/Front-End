<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* selectors  */
        h1{color:blue}
        
        #par2{color:yellowgreen}
        .group-1{color:red}
        .group-3{background: black; color:#FFF}

        /* select Multiple  */
        span, .lab-1{color:yellow}

        /* child and descendant */
        div p {
            color:red;
        }
        .about>p{
            color:blue;
        }
    </style>
</head>
<body>
    <h1> Introduction to CSS  - Cascading Stylesheet </h1>
    <h1> Introduction to CSS  - Cascading Stylesheet </h1>
    <p id="par1"> Hello World</p>
    <p id="par2"> Hello World</p>

    <div class="group-1"> Hello World </div>
    <div class="group-1"> Hello World </div>
    <div class="group-1"> Hello World </div>
    <div class="group-1"> Hello World </div>
    <div class="group-1"> Hello World </div>
    <div class="group-2"> Hello World </div>
    <div class="group-3 group-1">  Lorem, ipsum dolor.</div>

    <!-- Select Multiple  -->
     <span> Lorem, ipsum.</span>
     <label for="" class="lab-1"> Lorem, ipsum dolor.</label>

     <!-- child and descendant  -->
    <div class="about">
            <p> Child </p>
            <section>
                <p> Descendant </p>
            </section>
            <h3> Me</h3>
    </div>
</body>
</html>
