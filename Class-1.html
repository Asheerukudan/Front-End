<body>
    Hello World 
    <h1>Heading 1</h1>

    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
    <!-- html comment   -->

     OL: order list
     UL: Unordered list
     LI: List Item
     OL types: !, A, i, I, a
     UL types: Disc none circle square
      -->

      <ul type="circle">
        <li>Css</li>
        <li>Html</li>
        <li>Python</li>
      </ul>
      <ol type="1" reversed>
        <li>Red</li>
        <li>Blue</li>
        <li>Green</li>
      </ol>
      <!-- HTML formating Tags and Entities -->
       <b>Bold Text</b>
       <U>underline</U>
       <I>Italic</I>
       <sup>Supercript</sup>
       <sub>subcript</sub>
</body>
